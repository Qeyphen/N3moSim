version: '3.8'

networks:
  ros_net:
    driver: bridge

services:

  ros_bridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: n3mo_control:latest
    container_name: n3mo_bridge
    networks:
      - ros_net
    ports:
      - "10000:10000"
    volumes:
      - ./ros2_ws/src/n3mo_control:/root/ros2_ws/src/n3mo_control
      - ./config:/n3mosim/config
      - ./recordings:/recordings 
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=<CycloneDDS><Domain><General><NetworkInterfaceAddress>eth0</NetworkInterfaceAddress></General></Domain></CycloneDDS>
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        export AMENT_PREFIX_PATH=/root/ros2_ws/install/n3mo_control:/root/ros2_ws/install/ros_tcp_endpoint:$$AMENT_PREFIX_PATH &&
        source /root/ros2_ws/install/setup.bash &&
        echo 'Starting ROS TCP Bridge on 0.0.0.0:10000...' &&
        ros2 run ros_tcp_endpoint default_server_endpoint --ros-args -p ROS_IP:=0.0.0.0 -p ROS_TCP_PORT:=10000
      "
    restart: unless-stopped

  n3mo_controller:
    image: n3mo_control:latest
    container_name: n3mo_controller
    networks:
      - ros_net
    depends_on:
      - ros_bridge
    volumes:
      - ./ros2_ws/src/n3mo_control:/root/ros2_ws/src/n3mo_control
      - ./config:/n3mosim/config
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=<CycloneDDS><Domain><General><NetworkInterfaceAddress>eth0</NetworkInterfaceAddress></General></Domain></CycloneDDS>
    command: >
      bash -c "
        sleep 5 &&
        cd /root/ros2_ws &&
        source /opt/ros/humble/setup.bash &&
        colcon build --packages-select n3mo_control 2>/dev/null &&
        export AMENT_PREFIX_PATH=/root/ros2_ws/install/n3mo_control:/root/ros2_ws/install/ros_tcp_endpoint:$$AMENT_PREFIX_PATH &&
        source /root/ros2_ws/install/setup.bash &&
        echo 'Starting N3mo Controller...' &&
        ros2 run n3mo_control n3mo_controller
      "
    restart: unless-stopped

  mission_planner:
    image: n3mo_control:latest
    container_name: n3mo_mission
    networks:
      - ros_net
    depends_on:
      - ros_bridge
      - n3mo_controller
    volumes:
      - ./ros2_ws/src/n3mo_control:/root/ros2_ws/src/n3mo_control
      - ./config:/n3mosim/config
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=<CycloneDDS><Domain><General><NetworkInterfaceAddress>eth0</NetworkInterfaceAddress></General></Domain></CycloneDDS>
    command: >
      bash -c "
        sleep 8 &&
        cd /root/ros2_ws &&
        source /opt/ros/humble/setup.bash &&
        colcon build --packages-select n3mo_control 2>/dev/null &&
        export AMENT_PREFIX_PATH=/root/ros2_ws/install/n3mo_control:/root/ros2_ws/install/ros_tcp_endpoint:$$AMENT_PREFIX_PATH &&
        source /root/ros2_ws/install/setup.bash &&
        echo 'Starting Mission Planner...' &&
        ros2 run n3mo_control mission_planner
      "
    restart: unless-stopped

  sensor_publisher:
    image: n3mo_control:latest
    container_name: n3mo_sensors
    networks:
      - ros_net
    depends_on:
      - ros_bridge
    volumes:
      - ./ros2_ws/src/n3mo_control:/root/ros2_ws/src/n3mo_control
      - ./config:/n3mosim/config
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=<CycloneDDS><Domain><General><NetworkInterfaceAddress>eth0</NetworkInterfaceAddress></General></Domain></CycloneDDS>
    command: >
      bash -c "
        sleep 6 &&
        cd /root/ros2_ws &&
        source /opt/ros/humble/setup.bash &&
        colcon build --packages-select n3mo_control 2>/dev/null &&
        export AMENT_PREFIX_PATH=/root/ros2_ws/install/n3mo_control:/root/ros2_ws/install/ros_tcp_endpoint:$$AMENT_PREFIX_PATH &&
        source /root/ros2_ws/install/setup.bash &&
        echo 'Starting Sensor Publisher...' &&
        ros2 run n3mo_control sensor_publisher
      "
    restart: unless-stopped

  obstacle_detector:
    image: n3mo_control:latest
    container_name: n3mo_obstacles
    networks:
      - ros_net
    depends_on:
      - ros_bridge
      - sensor_publisher
    volumes:
      - ./ros2_ws/src/n3mo_control:/root/ros2_ws/src/n3mo_control
      - ./config:/n3mosim/config
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=<CycloneDDS><Domain><General><NetworkInterfaceAddress>eth0</NetworkInterfaceAddress></General></Domain></CycloneDDS>
    command: >
      bash -c "
        sleep 10 &&
        cd /root/ros2_ws &&
        source /opt/ros/humble/setup.bash &&
        colcon build --packages-select n3mo_control 2>/dev/null &&
        export AMENT_PREFIX_PATH=/root/ros2_ws/install/n3mo_control:/root/ros2_ws/install/ros_tcp_endpoint:$$AMENT_PREFIX_PATH &&
        source /root/ros2_ws/install/setup.bash &&
        echo 'Starting Obstacle Detector...' &&
        ros2 run n3mo_control obstacle_detector
      "
    restart: unless-stopped

  trajectory_publisher:
    image: n3mo_control:latest
    container_name: n3mo_trajectory
    networks:
      - ros_net
    depends_on:
      - ros_bridge
      - n3mo_controller
    volumes:
      - ./ros2_ws/src/n3mo_control:/root/ros2_ws/src/n3mo_control
      - ./config:/n3mosim/config
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=<CycloneDDS><Domain><General><NetworkInterfaceAddress>eth0</NetworkInterfaceAddress></General></Domain></CycloneDDS>
      - SCENARIO_FILE=scenario_mixed.json
    command: >
      bash -c "
        sleep 12 &&
        cd /root/ros2_ws &&
        source /opt/ros/humble/setup.bash &&
        colcon build --packages-select n3mo_control 2>/dev/null &&
        export AMENT_PREFIX_PATH=/root/ros2_ws/install/n3mo_control:/root/ros2_ws/install/ros_tcp_endpoint:$$AMENT_PREFIX_PATH &&
        source /root/ros2_ws/install/setup.bash &&
        echo 'Starting Trajectory Publisher...' &&
        ros2 run n3mo_control trajectory_publisher --ros-args \
          -p scenario_file:=$${SCENARIO_FILE}
      "
    restart: unless-stopped

  occupancy_grid_server:
    image: n3mo_control:latest
    container_name: n3mo_grid
    networks:
      - ros_net
    depends_on:
      - ros_bridge
    volumes:
      - ./ros2_ws/src/n3mo_control:/root/ros2_ws/src/n3mo_control
      - ./config:/n3mosim/config
      - ./recordings:/recordings 
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=<CycloneDDS><Domain><General><NetworkInterfaceAddress>eth0</NetworkInterfaceAddress></General></Domain></CycloneDDS>
    command: >
      bash -c "
        sleep 8 &&
        cd /root/ros2_ws &&
        source /opt/ros/humble/setup.bash &&
        colcon build --packages-select n3mo_control 2>/dev/null &&
        export AMENT_PREFIX_PATH=/root/ros2_ws/install/n3mo_control:/root/ros2_ws/install/ros_tcp_endpoint:$$AMENT_PREFIX_PATH &&
        source /root/ros2_ws/install/setup.bash &&
        echo 'Starting Occupancy Grid Server...' &&
        ros2 run n3mo_control occupancy_grid_server --ros-args -p origin_x:=-500.0 -p origin_y:=-500.0 -p width_m:=1000.0 -p height_m:=1000.0
      "
    restart: unless-stopped
  
  grid_visualiser:
    image: n3mo_control:latest
    container_name: n3mo_viz
    networks:
      - ros_net
    depends_on:
      - ros_bridge
      - occupancy_grid_server
    volumes:
      - ./ros2_ws/src/n3mo_control:/root/ros2_ws/src/n3mo_control
      - ./config:/n3mosim/config
    ports:
      - "8080:8080"
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=<CycloneDDS><Domain><General><NetworkInterfaceAddress>eth0</NetworkInterfaceAddress></General></Domain></CycloneDDS>
    command: >
      bash -c "
        sleep 12 &&
        cd /root/ros2_ws &&
        source /opt/ros/humble/setup.bash &&
        colcon build --packages-select n3mo_control 2>/dev/null &&
        export AMENT_PREFIX_PATH=/root/ros2_ws/install/n3mo_control:/root/ros2_ws/install/ros_tcp_endpoint:$$AMENT_PREFIX_PATH &&
        source /root/ros2_ws/install/setup.bash &&
        pip install flask 2>/dev/null || apt-get install -y python3-flask -q &&
        echo 'Starting Grid Visualiser on http://localhost:8080' &&
        python3 /root/ros2_ws/src/n3mo_control/n3mo_control/grid_visualiser.py
      "
    restart: unless-stopped